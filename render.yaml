# Despliegue del portal financiero en Render.
#
# Un solo servicio sirve la API y la SPA del portal, para que la cookie de
# sesión sea de primera parte. El sitio público (korabysela.dev) sigue en
# GitHub Pages y no se toca.
#
# MongoDB Atlas vive fuera de Render. La URI se solicita como secreto al crear
# el Blueprint y nunca se guarda en Git.

services:
  - type: web
    name: kora-portal
    runtime: node
    plan: free
    region: oregon
    branch: main
    # Se compila el portal y se instalan solo las dependencias del servidor.
    buildCommand: cd portal && npm ci && npm run build && cd ../server && npm ci --omit=dev
    startCommand: cd server && npm start
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"

      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: kora

      # El dominio del portal, tal cual, con https.
      - key: PUBLIC_ORIGIN
        value: https://portal.korabysela.dev

      - key: SESSION_SECURE_COOKIE
        value: "true"
